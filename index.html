<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jurnal drTrade - Personal Trading Journal</title>
  
  <!-- Web App & PWA Settings (Sangat nyaman saat di Add to Home Screen HP) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="drTrade">
  <meta name="theme-color" content="#0B0F17">
  
  <!-- Favicon Elegan -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230B0F17'/><circle cx='50' cy='50' r='32' fill='%2310B981'/><path d='M35 52 L45 62 L65 38' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height untuk layar browser smartphone */
      overflow: hidden;
      background-color: #0B0F17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Loading Splash Screen Modern */
    #loader {
      position: fixed;
      inset: 0;
      background: #0B0F17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    .loader-dot {
      width: 10px;
      height: 10px;
      background: #EF4444;
      border-radius: 50%;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Fullscreen Responsive Iframe */
    #appFrame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Splash Screen Sementara Saat Memuat -->
  <div id="loader">
    <div class="loader-brand">
      <span>Jurnal drTrade</span>
      <span class="loader-dot"></span>
    </div>
    <div class="spinner"></div>
  </div>

  <!-- Fullscreen Iframe Apps Script -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbypGd3Jf3IZKmDI5_W9RiXERRdtErMWOHJHL4a63YmFDdfXxfUBKBsuDmjPqjZX2KX2/exec"
    allow="clipboard-read; clipboard-write; fullscreen"
    title="Jurnal drTrade"
    onload="hideLoader()"
  ></iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.visibility = 'hidden';
        }, 400);
      }
    }

    // Otomatis hilangkan loader dalam 3 detik jika iframe sudah aktif
    setTimeout(hideLoader, 3000);
  </script>
</body>
</html>
